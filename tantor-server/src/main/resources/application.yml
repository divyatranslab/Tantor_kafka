spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tantor-server
    
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TANTOR_KEYCLOAK_ISSUER_URI:https://keycloak.tantor.io/realms/Gatekeeper}
          
  
  datasource:
    url: ${TANTOR_DB_URL:jdbc:postgresql://localhost:5432/tantor}
    username: ${TANTOR_DB_USER:postgres}
    password: ${TANTOR_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true
    clean-on-validation-error: false
    ignore-missing-migrations: true
    validate-on-migrate: false

server:
  port: 8443
  ssl:
    enabled: false
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: tantor
    client-auth: want # Allow mTLS but not strictly enforce for all paths (UI uses JWT)

tantor:
  security:
    proxy-secret: ${TANTOR_PROXY_SECRET}
    encryption:
      key: ${TANTOR_ENCRYPTION_KEY:1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p}
    truststore-dir: ${TANTOR_TRUSTSTORE_DIR:/srv/tantor/security/truststores}
    jwt:
      secret: ${TANTOR_JWT_SECRET:v2A7+S3L2Yg7d3vK7s2d1L/1mZ3v3k6/n1oP2K7bL2E=}
      expiration-ms: 86400000 # 24 hours
  artifact-repo:
    url: ${TANTOR_REPO_URL:http://localhost:8081}
    jmx-exporter-artifact-id: ${TANTOR_JMX_EXPORTER_ARTIFACT_ID:}
  hosts:
    heartbeat-timeout-seconds: ${TANTOR_HOST_HEARTBEAT_TIMEOUT_SECONDS:90}
  discovery-agent:
    heartbeat-timeout-seconds: ${TANTOR_DISCOVERY_AGENT_HEARTBEAT_TIMEOUT_SECONDS:45}
  external-clusters:
    kafka-health-timeout-seconds: ${TANTOR_EXTERNAL_KAFKA_HEALTH_TIMEOUT_SECONDS:5}
  rolling-restart:
    max-disk-used-percent: ${TANTOR_ROLLING_RESTART_MAX_DISK_USED_PERCENT:85}
    max-consumer-lag: ${TANTOR_ROLLING_RESTART_MAX_CONSUMER_LAG:1000000}
    health-timeout-seconds: ${TANTOR_ROLLING_RESTART_HEALTH_TIMEOUT_SECONDS:300}
    health-poll-seconds: ${TANTOR_ROLLING_RESTART_HEALTH_POLL_SECONDS:10}
    stable-samples: ${TANTOR_ROLLING_RESTART_STABLE_SAMPLES:2}
  monitoring:
    mode: ${TANTOR_MONITORING_MODE:direct}
    prometheus-url: ${TANTOR_PROMETHEUS_URL:http://loki-prometheus-server:80}
    grafana-url: ${TANTOR_GRAFANA_URL:https://monitoring.tantor.io}
    grafana-datasource-uid: ${TANTOR_GRAFANA_DATASOURCE_UID:PBFA97CFB590B2093}
    grafana-username: ${TANTOR_GRAFANA_USERNAME:}
    grafana-password: ${TANTOR_GRAFANA_PASSWORD:}
    grafana-skip-tls-validation: ${TANTOR_GRAFANA_SKIP_TLS_VALIDATION:true}
    exporter-host: ${TANTOR_MONITORING_EXPORTER_HOST:}
    kafka-exporter-port-base: ${TANTOR_KAFKA_EXPORTER_PORT_BASE:9308}
    jmx-exporter-port: ${TANTOR_JMX_EXPORTER_PORT:7071}

