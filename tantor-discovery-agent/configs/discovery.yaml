discovery:
  # Unique ID/name for this VM-side discovery agent. The deploy script can
  # generate these automatically from the target VM IP.
  host_id: "discovery-example-node"
  agent_name: "tantor-discovery-example-node"

  # Tantor backend URL for the current client environment.
  server_url: "https://<tantor-server-ip-or-dns>:<port>"

  interval: "15s"
  task_poll_interval: "5s"

  # Every OS command and HTTP operation is bounded and cancelled on shutdown.
  command_timeout: "30s"
  http:
    connect_timeout: "3s"
    tls_handshake_timeout: "5s"
    response_header_timeout: "5s"
    request_timeout: "10s"
    retry_total_timeout: "25s"
    retry_max_attempts: 3
    retry_initial_backoff: "250ms"
    retry_max_backoff: "2s"
    circuit_failure_threshold: 5
    circuit_open_duration: "30s"

  # Optional but preferred in production. When set, the agent checks this
  # install first before falling back to broad scan_paths discovery.
  kafka_home: "/opt/kafka_2.13-4.1.0"

  # Optional exact config files. Repeat entries when broker/controller use
  # separate files.
  kafka_config_files:
    # - "/opt/kafka_2.13-4.1.0/config/broker.properties"
    # - "/opt/kafka_2.13-4.1.0/config/controller.properties"

  # Optional deploy-time directory overrides when Kafka config omits or hides
  # real data/log directories.
  kafka_data_dirs: ""
  kafka_log_dirs: ""

  scan_paths:
    - "/opt"
    - "/opt_apb"
    - "/app"
    - "/srv"
    - "/data"
    - "/usr/local"
    - "/usr/share"
    - "/var/lib"

  # Leave empty to use the VM hostname.
  node_name: ""

  # For a limited runtime user, prefer sudo with a restricted sudoers rule.
  restart_command: "sudo systemctl restart kafka.service"
  systemd_use_sudo: true

  # JMX/Prometheus exporter endpoint on the Kafka VM. Set disable_metrics true
  # if exporters are not installed in the client environment.
  metrics_url: "http://localhost:7071/metrics"
  disable_metrics: false

  # Keep precheck enabled for fresh deployment safety.
  skip_precheck: false

  # The control-plane CA and per-agent certificate/key are mandatory. Private
  # keys are provisioned outside source control with mode 0600.
  tls_ca_cert: "/etc/tantor-discovery-agent/certs/control-plane-ca.crt"
  tls_client_cert: "/etc/tantor-discovery-agent/certs/discovery-agent.crt"
  tls_client_key: "/etc/tantor-discovery-agent/certs/discovery-agent.key"
