---
- name: 6. Resume Deployment via Backend API (Payload Driven)
  hosts: localhost
  gather_facts: false
  vars:
    # payload_file must be provided via --extra-vars
    # Example: ansible-playbook 6_resume.yml -e payload_file="payloads/resume.json"
  tasks:
    - name: Load payload file
      ansible.builtin.set_fact:
        payload: "{{ lookup('file', payload_file) | from_json }}"

    - name: Query all clusters to resolve cluster_id (if required by backend)
      ansible.builtin.uri:
        url: "{{ backend_url }}/api/v1/clusters"
        method: GET
        status_code: 200
      register: clusters_response
      ignore_errors: true

    - name: Extract target cluster_id
      ansible.builtin.set_fact:
        target_cluster_id: >-
          {%- if not clusters_response.failed -%}
          {{ (clusters_response.json | selectattr('name', 'equalto', payload.cluster_name) | list | first).id | default(payload.cluster_name) }}
          {%- else -%}
          {{ payload.cluster_name }}
          {%- endif -%}

    - name: Trigger Resume / Retry
      ansible.builtin.uri:
        url: "{{ backend_url }}/api/v1/clusters/{{ target_cluster_id }}/retry"
        method: POST
        status_code: 200, 202
      register: resume_response

    - name: Display backend response
      ansible.builtin.debug:
        var: resume_response.json
