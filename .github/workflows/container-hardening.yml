name: Container hardening

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/.dockerignore'
      - '**/*compose*.yml'
      - 'tantor-ui/nginx*.conf'
      - 'package-deployment.ps1'
      - 'deploy/production/**'
      - 'tantor-artifact-repository/deploy/k8s/**'
      - 'scripts/Test-ContainerHardening.ps1'
      - '.github/workflows/container-hardening.yml'
  push:
    branches:
      - master
    paths:
      - '**/Dockerfile'
      - '**/.dockerignore'
      - '**/*compose*.yml'
      - 'tantor-ui/nginx*.conf'
      - 'package-deployment.ps1'
      - 'deploy/production/**'
      - 'tantor-artifact-repository/deploy/k8s/**'
      - 'scripts/Test-ContainerHardening.ps1'
      - '.github/workflows/container-hardening.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce immutable images and runtime controls
        shell: pwsh
        run: ./scripts/Test-ContainerHardening.ps1
      - name: Validate development Compose model
        run: docker compose -f podman-compose.yml config --quiet
      - name: Validate integration-test Compose model
        run: docker compose -f docker-compose-test.yml config --quiet
      - name: Validate production Compose schema
        run: docker compose -f podman-compose.production.yml config --no-interpolate --quiet
