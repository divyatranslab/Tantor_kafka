name: Secret scanning

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and tag for history scanning
        run: >-
          git fetch --force origin
          '+refs/heads/*:refs/remotes/origin/*'
          '+refs/tags/*:refs/tags/*'

      - name: Scan current files
        run: >-
          docker run --rm --network=none
          -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          dir --config=/repo/.gitleaks.toml --redact --verbose --exit-code=1 /repo

      - name: Scan complete reachable history
        run: >-
          docker run --rm --network=none
          -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          git --config=/repo/.gitleaks.toml --redact --verbose --exit-code=1 /repo

      - name: Verify the scanner detects a synthetic credential
        shell: bash
        run: |
          set -Eeuo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          synthetic_value='TEST_''SECRET_DO_NOT_USE_a8H2m9Q4x7K6p3Z5'
          printf 'password = "%s"\n' "$synthetic_value" > "$fixture/fixture.txt"
          set +e
          docker run --rm --network=none \
            -v "$PWD:/repo:ro" -v "$fixture:/scan:ro" \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            dir --config=/repo/.gitleaks.toml --redact --exit-code=1 /scan
          status=$?
          set -e
          test "$status" -eq 1 || {
            echo "Gitleaks did not detect the synthetic credential (exit $status)." >&2
            exit 1
          }
