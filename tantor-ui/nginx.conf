server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    # SSL Config (Paths would typically be mounted via Docker/K8s)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Agent CA Configuration
    ssl_client_certificate /etc/nginx/certs/agent-ca.crt;
    ssl_verify_client optional;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/artifacts {
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/agents/ {
        # Strict enforcement for agent endpoints
        if ($ssl_client_verify != SUCCESS) {
            return 401;
        }

        proxy_pass http://host.docker.internal:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Strip incoming spoofed headers
        proxy_set_header X-Forwarded-Client-DN "";
        proxy_set_header X-Proxy-Secret "";
        
        # Inject verified mTLS identity and proxy secret
        proxy_set_header X-Forwarded-Client-DN $ssl_client_s_dn;
        # Uses docker-entrypoint envsubst to inject PROXY_SECRET at container runtime
        proxy_set_header X-Proxy-Secret "${TANTOR_PROXY_SECRET}"; 
    }

    location /api {
        proxy_pass http://host.docker.internal:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
