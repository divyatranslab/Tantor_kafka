server {
    listen 8080;
    server_name _;
    server_tokens off;

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_client_certificate /run/secrets/agent-ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 3;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.cdnfonts.com; img-src 'self' data: blob:; connect-src 'self' https://configuration.invalid; frame-src https://configuration.invalid; form-action 'self' https://configuration.invalid" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/artifacts {
        proxy_pass http://tantor-artifact-repository:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Machine control-plane routes require a certificate issued by the
    # dedicated agent CA. Browser/UI routes continue to use application auth.
    location ~ ^/api/v1/agents(?:/|$) {
        if ($ssl_client_verify != SUCCESS) { return 496; }
        proxy_pass http://tantor-server:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tantor-Client-Cert $ssl_client_escaped_cert;
    }

    location ~ ^/api/v1/ui/external-clusters/discovery(?:/|$) {
        if ($ssl_client_verify != SUCCESS) { return 496; }
        proxy_pass http://tantor-server:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tantor-Client-Cert $ssl_client_escaped_cert;
    }

    location /api {
        proxy_pass http://tantor-server:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
