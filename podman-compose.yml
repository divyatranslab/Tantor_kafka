version: '3.8'

services:
  database:
    image: postgres:13
    container_name: tantor_db
    environment:
      POSTGRES_DB: tantor
      POSTGRES_USER: ${TANTOR_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TANTOR_DB_PASSWORD:?TANTOR_DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - tantor_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  tantor-artifact-repository:
    build:
      context: ./tantor-artifact-repository
    container_name: tantor_artifact_repo
    environment:
      TANTOR_DB_URL: jdbc:postgresql://database:5432/tantor
      TANTOR_DB_USER: ${TANTOR_DB_USER:?TANTOR_DB_USER is required}
      TANTOR_DB_PASSWORD: ${TANTOR_DB_PASSWORD:?TANTOR_DB_PASSWORD is required}
      TANTOR_PROXY_SECRET: ${TANTOR_PROXY_SECRET:?TANTOR_PROXY_SECRET is required}
    ports:
      - "8081:8081"
    volumes:
      - tantor_repo_data:/var/lib/tantor/repository
    restart: unless-stopped

  tantor-server:
    build:
      context: ./tantor-server
    container_name: tantor_server
    environment:
      TANTOR_DB_URL: jdbc:postgresql://database:5432/tantor
      TANTOR_DB_USER: ${TANTOR_DB_USER:-postgres}
      TANTOR_DB_PASSWORD: ${TANTOR_DB_PASSWORD:?TANTOR_DB_PASSWORD is required}
      TANTOR_REPO_URL: http://tantor-artifact-repository:8081
      TANTOR_MONITORING_MODE: ${TANTOR_MONITORING_MODE:-direct}
      TANTOR_PROMETHEUS_URL: ${TANTOR_PROMETHEUS_URL:-http://prometheus:9090}
      TANTOR_PROXY_SECRET: ${TANTOR_PROXY_SECRET:?TANTOR_PROXY_SECRET is required}
      TANTOR_ENCRYPTION_KEY: ${TANTOR_ENCRYPTION_KEY:?TANTOR_ENCRYPTION_KEY is required}
      TANTOR_ENCRYPTION_SALT: ${TANTOR_ENCRYPTION_SALT:?TANTOR_ENCRYPTION_SALT is required}
      TANTOR_ENCRYPTION_LEGACY_KEY: ${TANTOR_ENCRYPTION_LEGACY_KEY:-}
      TANTOR_JWT_SECRET: ${TANTOR_JWT_SECRET:?TANTOR_JWT_SECRET is required}
      TANTOR_SSL_KEYSTORE_PASSWORD: ${TANTOR_SSL_KEYSTORE_PASSWORD:?TANTOR_SSL_KEYSTORE_PASSWORD is required}
      TANTOR_GRAFANA_PASSWORD: ${TANTOR_GRAFANA_PASSWORD:?TANTOR_GRAFANA_PASSWORD is required}
    ports:
      - "8443:8443"
    depends_on:
      - database
      - tantor-artifact-repository
    restart: unless-stopped

  tantor-ui:
    build:
      context: ./tantor-ui
    container_name: tantor_ui
    environment:
      TANTOR_PROXY_SECRET: ${TANTOR_PROXY_SECRET:?TANTOR_PROXY_SECRET is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scratch/certs:/etc/nginx/certs:ro
    depends_on:
      - tantor-server
      - tantor-artifact-repository
    restart: unless-stopped

volumes:
  tantor_db_data:
  tantor_repo_data:
